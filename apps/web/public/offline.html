<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Offline · Sunpride</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          "Mulish Variable",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #18181b;
        background: #ffffff;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
      }
      h1 {
        margin: 20px 0 6px;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.5;
        color: #71717a;
      }
      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 0 22px;
        border-radius: 10px;
        border: 0;
        background: #18181b;
        color: #ffffff;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Sunpride" />
      <h1>You are offline</h1>
      <p>Showing what was last loaded where possible.</p>
      <p>This page has not been opened on this phone yet.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
