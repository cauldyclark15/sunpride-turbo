name: FieldIOS
options:
  bundleIdPrefix: com.sunpride
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Debug-Dev: debug
  Release: release
  # SP-0132: the hand-out beta ("Sunpride Field (Beta)", com.sunpride.field.beta, signed by jc's team).
  Beta: release
packages:
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift.git
    exactVersion: 4.10.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: 'NO'
    # Simulator builds are ad-hoc signed ("Sign to Run Locally", no team) so the app gets its
    # application-identifier entitlement; without it every Keychain call fails with -34018.
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: 'YES'
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: '-'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''
targets:
  FieldIOS:
    type: application
    platform: iOS
    dependencies:
      - package: SQLCipher
    sources:
      - path: FieldIOS/Sources
        excludes:
          - '**/*.md'
      - path: FieldIOS/Resources
        buildPhase: resources
    configFiles:
      Debug: Config/Dev.xcconfig
      Debug-Dev: Config/Dev.xcconfig
      Release: Config/Dev.xcconfig
      Beta: Config/Beta.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunpride.field.dev
        INFOPLIST_FILE: FieldIOS/Info.plist
        PRODUCT_NAME: Sunpride Field (Dev)
        PRODUCT_MODULE_NAME: FieldIOS
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: com.sunpride.field.beta
          PRODUCT_NAME: Sunpride Field (Beta)
          # Device builds are signed by jc's own paid team (no App Store / TestFlight upload).
          CODE_SIGNING_ALLOWED: 'YES'
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: FV2R5JV6YD
          CODE_SIGN_IDENTITY: Apple Development
  FieldIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FieldIOSTests
      # Frozen cross-language vectors, referenced in place (never hand-copied).
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/crypto/request-proof.json
        buildPhase: resources
        group: FieldIOSTests/Fixtures
      # Original shared wire fixtures, copied into the test bundle without maintaining native duplicates.
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/bootstrap-request.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/bootstrap-response.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/bootstrap-call-sheet-response.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/bootstrap-account-summary-response.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/bootstrap-order-terms-response.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/push-call-sheet-request.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/suggested-order/for-outlet.json
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/bootstrap-activity-rules-response.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/bootstrap-photo-types-response.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/bootstrap-next-page.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/error-device-revoked.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/error-invalid-cursor.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/error-rebootstrap-required.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/error-version-unsupported.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/unknown-response-enum.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/push-request.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/push-planned-request.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/push-response.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/push-conflict-response.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/pull-request.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/pull-response.json
        buildPhase: resources
      # SP-0138 live-location batch envelopes.
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/location-request.json
        buildPhase: resources
      - path: ../../packages/domain-contracts/fixtures/mobile-v1/location-response.json
        buildPhase: resources
    dependencies:
      - target: FieldIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunpride.field.dev.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sunpride Field (Dev).app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sunpride Field (Dev)
        BUNDLE_LOADER: $(TEST_HOST)
  FieldIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FieldIOSUITests]
    dependencies:
      - target: FieldIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunpride.field.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FieldIOS-Dev:
    build:
      targets:
        FieldIOS: all
        FieldIOSTests: [test]
        FieldIOSUITests: [test]
    test:
      config: Debug
      targets:
        - FieldIOSTests
        - FieldIOSUITests
    run:
      config: Debug
  FieldIOS-Beta:
    build:
      targets:
        FieldIOS: all
    run:
      config: Beta
    archive:
      config: Beta
    profile:
      config: Beta
    analyze:
      config: Beta
