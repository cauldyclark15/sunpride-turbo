name: OfficeIOS
options:
  bundleIdPrefix: com.sunpride
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  # SP-0165: the hand-out beta ("Sunpride Office (Beta)", com.sunpride.office.beta, signed by jc's team).
  Beta: release
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_APPROACHABLE_CONCURRENCY: 'YES'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: 'NO'
    # Simulator builds are ad-hoc signed so the Keychain works (application-identifier entitlement).
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: 'YES'
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: '-'
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ''
targets:
  OfficeIOS:
    type: application
    platform: iOS
    sources:
      - path: OfficeIOS/Sources
        excludes:
          - '**/*.md'
      - path: OfficeIOS/Resources
        buildPhase: resources
    configFiles:
      Debug: Config/Dev.xcconfig
      Release: Config/Dev.xcconfig
      Beta: Config/Beta.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunpride.office.dev
        INFOPLIST_FILE: OfficeIOS/Info.plist
        PRODUCT_NAME: Sunpride Office (Dev)
        PRODUCT_MODULE_NAME: OfficeIOS
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          # Dev builds for jc's phone: signed by the same team (simulator stays ad-hoc).
          CODE_SIGNING_ALLOWED[sdk=iphoneos*]: 'YES'
          CODE_SIGN_STYLE[sdk=iphoneos*]: Automatic
          DEVELOPMENT_TEAM[sdk=iphoneos*]: FV2R5JV6YD
          CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
        Beta:
          PRODUCT_BUNDLE_IDENTIFIER: com.sunpride.office.beta
          PRODUCT_NAME: Sunpride Office (Beta)
          CODE_SIGNING_ALLOWED: 'YES'
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: FV2R5JV6YD
          CODE_SIGN_IDENTITY: Apple Development
  OfficeIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OfficeIOSTests
        excludes:
          - 'Fixtures/**'
      - path: OfficeIOSTests/Fixtures
        buildPhase: resources
        type: folder
    dependencies:
      - target: OfficeIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunpride.office.dev.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sunpride Office (Dev).app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sunpride Office (Dev)
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Beta:
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/Sunpride Office (Beta).app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sunpride Office (Beta)
  OfficeIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OfficeIOSUITests]
    dependencies:
      - target: OfficeIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunpride.office.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OfficeIOS-Dev:
    build:
      targets:
        OfficeIOS: all
        OfficeIOSTests: [test]
        OfficeIOSUITests: [test]
    test:
      config: Debug
      targets:
        - OfficeIOSTests
        - OfficeIOSUITests
    run:
      config: Debug
  OfficeIOS-Beta:
    build:
      targets:
        OfficeIOS: all
    run:
      config: Beta
    archive:
      config: Beta
