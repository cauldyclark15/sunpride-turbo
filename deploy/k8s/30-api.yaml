apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sunpride-api-files, namespace: sunpride}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: linode-block-storage-retain
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: sunpride-api, namespace: sunpride}
spec:
  selector: {app: sunpride-api}
  ports: [{name: http, port: 4320, targetPort: 4320}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: sunpride-api, namespace: sunpride}
spec:
  replicas: 1
  # Zero-downtime releases (16 Nov 2026: a client's save failed during a Recreate release).
  # The new pod starts beside the old one and takes traffic before the old one stops.
  # The two volumes are ReadWriteOnce = one NODE (not one pod): the podAffinity below keeps the
  # new pod on the old pod's node so both can mount them while they overlap.
  # Two api pods overlapping is safe: scheduler tasks hold pg advisory locks, jobs / SAP outbox /
  # customer uploads claim rows with leases or SKIP LOCKED, realtime fans out via LISTEN/NOTIFY,
  # and migrate.js serialises on an advisory lock. Migrations must stay backward compatible:
  # the old version keeps serving while the new pod's `migrate` init container runs.
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  minReadySeconds: 5
  selector: {matchLabels: {app: sunpride-api}}
  template:
    metadata: {labels: {app: sunpride-api}}
    spec:
      imagePullSecrets: [{name: regcred}]
      securityContext: {fsGroup: 1000}
      # preStop 10 s + api drain (SHUTDOWN_TIMEOUT_MS) + margin
      terminationGracePeriodSeconds: 45
      affinity:
        podAffinity:
          # Same node as the running api pod (RWO volumes). The first pod, or one rescheduled
          # after a node loss, has no peer and schedules anywhere.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: sunpride-api}}
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: migrate
          image: cauldyclark15/sunpride-api:placeholder
          workingDir: /app/packages/db
          command: ["bun", "src/migrate.js"]
          envFrom: [{secretRef: {name: sunpride-app}}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      containers:
        - name: api
          image: cauldyclark15/sunpride-api:placeholder
          envFrom:
            - secretRef: {name: sunpride-app}
            - configMapRef: {name: sunpride-api-env}
          env:
            # SP-0185 sign-in emails (reset links, temporary passwords). RESEND_API_KEY comes from sunpride-app.
            - {name: AUTH_EMAIL_PROVIDER, value: resend}
            - {name: AUTH_EMAIL_FROM, value: "Sunpride Support <support@cauldnclark.com>"}
            - {name: PUBLIC_WEB_URL, value: "https://sunpride.cauldnclark.com"}
            # SP-0245: the existing APK publisher's credential, not a user/session credential.
            - name: SP_APP_RELEASE_TOKEN
              valueFrom:
                secretKeyRef: {name: sunpride-app-release, key: SP_APP_RELEASE_TOKEN, optional: true}
          ports: [{containerPort: 4320}]
          lifecycle:
            # Keep serving while the ingress stops sending here; SIGTERM then drains in-flight requests.
            preStop: {sleep: {seconds: 10}}
          readinessProbe:
            httpGet: {path: /healthz, port: 4320}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 4320}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: files, mountPath: /data/files}
            # staged APKs (SP_APP_RELEASE_DIR) live on the sap-mock volume: copy-data `files` wipes
            # sunpride-api-files, `sap` only replaces the sqlite file.
            - {name: sapdata, mountPath: /data/sapvol}
        - name: sap-mock
          image: cauldyclark15/sunpride-sap-mock:placeholder
          lifecycle:
            # Outlive the api container's preStop + drain: requests still finishing may call SAP.
            preStop: {sleep: {seconds: 22}}
          env:
            - {name: HOST, value: 127.0.0.1}
            - {name: PORT, value: "4435"}
            - {name: SAP_MOCK_DB, value: /data/sap-mock.sqlite}
            - name: SAP_MOCK_TOKEN
              valueFrom: {secretKeyRef: {name: sunpride-app, key: SAP_TOKEN}}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts: [{name: sapdata, mountPath: /data}]
      volumes:
        - name: sapdata
          persistentVolumeClaim: {claimName: sunpride-sap-mock-data}
        - name: files
          persistentVolumeClaim: {claimName: sunpride-api-files}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: sunpride-api-env, namespace: sunpride}
data:
  HOST: 0.0.0.0
  PORT: "4320"
  BOOTSTRAP_ADMIN_EMAILS: jcing.jc@gmail.com
  SAP_MODE: mock
  SAP_ORIGIN: http://127.0.0.1:4435
  FILES_DIR: /data/files
  PUBLIC_ORIGIN: https://sunpride.cauldnclark.com
  DB_POOL_MAX: "20"
  # SIGTERM: up to ~half of this drains in-flight requests (src/server.js)
  SHUTDOWN_TIMEOUT_MS: "20000"
  # MT OCR on Linux (ocr.js otherwise needs macOS swift)
  SUNPRIDE_OCR_COMMAND: '["bun","/app/apps/api/scripts/ocr-tesseract.js"]'
  # APK release inspection (apk-artifacts.js) with Debian aapt/apksigner instead of the Mac SDK
  SP_ANDROID_BUILD_TOOLS: /usr/bin
  SP_ANDROID_JAVA_HOME: /usr/lib/jvm/default-java
  SP_APP_RELEASE_DIR: /data/sapvol/app-releases
