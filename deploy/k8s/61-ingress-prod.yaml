apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sunpride-prod
  namespace: sunpride
  annotations:
    cert-manager.io/cluster-issuer: cnc-cert
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sunpride.cauldnclark.com]
      secretName: sunpride-prod-tls
  rules:
    - host: sunpride.cauldnclark.com
      http:
        paths:
          - path: /(api|ws|sync|healthz)(/.*)?$
            pathType: ImplementationSpecific
            backend: {service: {name: sunpride-api, port: {number: 4320}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: sunpride-web, port: {number: 4330}}}
